<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A2F"/>
      <stop offset="100%" stop-color="#0E1E18"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4BE5E"/>
      <stop offset="100%" stop-color="#D49A3D"/>
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F"/>
      <stop offset="100%" stop-color="#B85C38"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="90" fill="none" stroke="#D49A3D" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Bridge Arc (Connecting the World) -->
  <path d="M 64 360 C 160 270, 352 270, 448 360" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 88 385 C 176 305, 336 305, 424 385" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Vertical Bridge Support Ribs -->
  <line x1="160" y1="316" x2="160" y2="390" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="208" y1="290" x2="208" y2="395" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="256" y1="280" x2="256" y2="400" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="304" y1="290" x2="304" y2="395" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="352" y1="316" x2="352" y2="390" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Sun Rays rising behind Jebena -->
  <circle cx="256" cy="200" r="80" fill="none" stroke="#F4BE5E" stroke-width="2" stroke-dasharray="6 8" opacity="0.4"/>
  <circle cx="256" cy="200" r="110" fill="none" stroke="#F4BE5E" stroke-width="2" stroke-dasharray="4 12" opacity="0.25"/>

  <!-- Traditional Ethiopian Jebena (Coffee Pot) Motif -->
  <!-- Pot Body -->
  <circle cx="256" cy="210" r="48" fill="url(#goldGrad)"/>
  
  <!-- Jebena Neck & Spout -->
  <path d="M 246 164 L 242 120 C 242 114, 270 114, 270 120 L 266 164 Z" fill="url(#goldGrad)"/>
  <ellipse cx="256" cy="116" rx="14" ry="5" fill="#F4BE5E"/>
  
  <!-- Spout angle -->
  <path d="M 284 190 L 314 150 C 318 144, 324 148, 320 154 L 294 206 Z" fill="url(#goldGrad)"/>
  
  <!-- Jebena Curved Handle -->
  <path d="M 226 150 C 196 170, 196 220, 222 236" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>

  <!-- Aroma / Steam swirls rising from coffee pot -->
  <path d="M 252 98 C 248 84, 258 74, 252 60" fill="none" stroke="#F4BE5E" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M 262 102 C 268 88, 260 76, 266 64" fill="none" stroke="#F4BE5E" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Star of Ethiopia / Sunshine sparkle -->
  <polygon points="256,36 260,46 270,50 260,54 256,64 252,54 242,50 252,46" fill="#F4BE5E"/>

  <!-- Brand Text Under Bridge -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#F4BE5E" letter-spacing="4">BRIDGE ETHIOPIA</text>
  <text x="256" y="468" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="15" fill="#D9D0C1" letter-spacing="2">HINDEK COFFEE &amp; TOURS</text>
</svg>
